name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_windows:
        description: "windows-integration 을 -Bootstrap 모드로 실행해 expected_*.json 기준값을 새로 생성(수동 트리거 전용)"
        type: boolean
        default: false

jobs:
  static-analysis:
    # 저장소 전체 sh/ps1/psm1/py 를 대상으로 하는 가장 저렴한 회귀 방어선 - 매 push/PR 마다
    # 돈다. ubuntu-latest 에 shellcheck 와 pwsh 가 기본 설치되어 있어 Windows 러너 없이도
    # PSScriptAnalyzer 까지 전부 실행 가능하다(PSScriptAnalyzer 는 PowerShell 자체가
    # 크로스플랫폼이라 pwsh 코어에서도 동일하게 동작).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (전체 *.sh)
        run: |
          set -e
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)
          files=$(find . -name "*.sh" -not -path "./output/*" -not -path "./.git/*")
          echo "검사 대상: $(echo "$files" | wc -l)개"
          shellcheck -S error -s sh $files

      - name: PSScriptAnalyzer (전체 *.ps1 / *.psm1)
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1 | Where-Object { $_.FullName -notmatch '[\\/]output[\\/]' }
          Write-Host "검사 대상: $($files.Count)개"
          $hadError = $false
          foreach ($f in $files) {
              $tokens = $null; $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
              if ($errs.Count -gt 0) {
                  Write-Host "[PARSE ERROR] $($f.FullName)"
                  $errs | ForEach-Object { Write-Host "  $_" }
                  $hadError = $true
              }
              $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              if (-not $hasBom) {
                  Write-Host "[NO BOM] $($f.FullName)"
                  $hadError = $true
              }
              $issues = Invoke-ScriptAnalyzer -Path $f.FullName -Severity Error
              if ($issues) {
                  $issues | ForEach-Object { Write-Host "[PSSA ERROR] $($f.FullName):$($_.Line) $($_.RuleName) - $($_.Message)" }
                  $hadError = $true
              }
          }
          if ($hadError) { exit 1 }

      - name: Python 전체 ast.parse
        run: |
          set -e
          err=0
          while IFS= read -r f; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1], encoding='utf-8').read())" "$f" || { echo "FAIL: $f"; err=1; }
          done < <(find . -name "*.py" -not -path "./output/*" -not -path "*/__pycache__/*" -not -path "./.git/*")
          exit $err

      # lib/Common.psm1 에 함수를 추가하고 Export-ModuleMember 목록에 빠뜨리면 run.ps1/fix.ps1 이
      # 실행 시점에 "is not recognized" 로 죽는다(파싱/PSSA 로는 안 잡힘 - 1.2.1/1.2.2 작업 중 실제로 두 번 겪음).
      - name: Common.psm1 함수 공개 목록 검사
        run: |
          python3 - <<'EOF'
          import re, sys
          t = open("lib/Common.psm1", encoding="utf-8-sig").read()
          defined = set(re.findall(r'^function\s+([A-Za-z]+-[A-Za-z]+)', t, re.M))
          m = re.search(r'Export-ModuleMember\s+-Function\s+(.*?)\s+-Variable', t, re.S)
          exported = {x.strip() for x in m.group(1).split(',')} if m else set()
          missing, extra = sorted(defined - exported), sorted(exported - defined)
          if missing or extra:
              print(f"정의됐지만 공개 안 됨: {missing} / 공개 목록에만 있음: {extra}")
              sys.exit(1)
          print(f"OK: {len(defined)}개 함수 모두 공개")
          EOF

  network:
    # 05_network 는 오프라인 설정파일 분석이라 Docker/실제 장비가 필요 없다 - Cisco IOS
    # vuln/hardened 픽스처 2종으로 38항목 전체 판정 로직을 회귀 테스트한다(05_network/
    # CLAUDE.md "실제 장비 출력을 검증한 게 아니라 판정 로직을 단위 테스트한 것"임을 그대로
    # 승계 - 영구 픽스처로 고정했을 뿐 검증 엄밀성 수준 자체는 바뀌지 않는다).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 05_network/tests/run_tests.py

  linux-integration:
    # Docker(Debian 12)로 01_unix 를 회귀 테스트한다 - vuln/hardened 두 픽스처로 ~20개 항목은
    # 명시적으로 취약/강화 상태를 주입하고, 나머지는 이 베이스 이미지의 있는 그대로의 기본값을
    # 반영한다(완전한 전수 강화 검증이 아님 - 01_unix/CLAUDE.md "테스트 커버리지" 참고).
    # rhel 계열은 아직 이 픽스처에 없다(후속 작업).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh 01_unix/tests/run_tests.sh
      - run: sh 03_web/tests/run_tests.sh
      - run: sh 08_dbms/tests/run_tests.sh

  windows-integration:
    # windows-latest(매 job마다 새로 생성되는 휘발성 VM)에서 02_windows/07_pc 를 실제로
    # 레지스트리까지 바꿔가며 회귀 테스트한다 - 이전까지는 Windows 레지스트리/보안정책을 실제로
    # 바꾸는 Docker 동급 격리 환경이 없어 "파싱/BOM/PSScriptAnalyzer만, 실제 --Apply 미실행"
    # 수준으로만 검증했는데(02_windows·07_pc/CLAUDE.md "실제 검증 범위" 참고), windows-latest
    # Actions 러너가 그 역할을 대신할 수 있다 - 휘발성이라 끝나면 버려지므로 로컬 개발자 PC에서는
    # 절대 이 스크립트(fixtures/apply.ps1)를 직접 실행하지 말 것. 02_windows는 W-15(개인키
    # 암호 보호), 07_pc는 PC-12(자동 로그인)만 명시적으로 vuln/hardened를 가르고 나머지는 이
    # 러너 이미지의 기본값을 반영한다. IIS(03_web)/MSSQL(08_dbms)은 아직 포함하지 않았다(후속
    # 작업 - 추가 기능/서비스 설치가 필요해 범위를 분리했다).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 02_windows 회귀 테스트
        shell: pwsh
        run: |
          $bootstrap = '${{ github.event.inputs.bootstrap_windows }}' -eq 'true'
          if ($bootstrap) { .\02_windows\tests\run_tests.ps1 -Bootstrap } else { .\02_windows\tests\run_tests.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 07_pc 회귀 테스트
        shell: pwsh
        run: |
          $bootstrap = '${{ github.event.inputs.bootstrap_windows }}' -eq 'true'
          if ($bootstrap) { .\07_pc\tests\run_tests.ps1 -Bootstrap } else { .\07_pc\tests\run_tests.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: bootstrap 산출물 업로드
        if: ${{ github.event.inputs.bootstrap_windows == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-expected-json
          path: |
            02_windows/tests/fixtures/expected_*.json
            07_pc/tests/fixtures/expected_*.json

  windows-server:
    # windows-latest 러너(Windows Server, 매 job 새로 만들어지는 휘발성 VM)를 "운영 Windows Server" 대용으로
    # 써서, 로컬(Windows 11 Home - Windows 컨테이너 불가)에서 할 수 없던 실기 검증을 한다: IIS 설치 후
    # 진단 회귀 + 조치 실적용·원복, Windows 조치 실적용·원복, 방화벽 안전장치. 대상 호스트와 같은
    # Windows PowerShell 5.1(shell: powershell)로 실행한다. 도메인 컨트롤러·한글 로캘은 재부팅이 필요해
    # 이 러너로는 검증할 수 없다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 주의: 여기 run: 블록은 GitHub 가 BOM 없는 UTF-8 .ps1 로 만들어 Windows PowerShell 5.1 이 한글을 깨뜨린다
      # (첫 실행에서 파싱 실패) - powershell 단계의 인라인 스크립트에는 한글을 쓰지 않는다(저장소 .ps1 은 BOM 있음).
      - name: environment
        shell: powershell
        run: |
          "PS $($PSVersionTable.PSVersion) / $((Get-CimInstance Win32_OperatingSystem).Caption) / culture $((Get-Culture).Name) ui $((Get-UICulture).Name)"
          "sqlcmd: $((Get-Command sqlcmd -ErrorAction SilentlyContinue).Source)"
          "SqlLocalDB: $((Get-Command SqlLocalDB -ErrorAction SilentlyContinue).Source)"
          if (Get-Command SqlLocalDB -ErrorAction SilentlyContinue) { SqlLocalDB info }
          "MSSQL services: $((Get-Service -Name 'MSSQL*' -ErrorAction SilentlyContinue | ForEach-Object { $_.Name + '=' + $_.Status }) -join ', ')"
          "Web-Server: $((Get-WindowsFeature Web-Server).InstallState) / Web-DAV-Publishing: $((Get-WindowsFeature Web-DAV-Publishing).InstallState)"
      - name: IIS 설치
        if: always()
        shell: powershell
        run: |
          Install-WindowsFeature Web-Server, Web-Mgmt-Tools, Web-Scripting-Tools, Web-DAV-Publishing, Web-Includes, Web-Http-Redirect, Web-Filtering, Web-ISAPI-Ext, Web-ISAPI-Filter, Web-CGI | Format-Table -AutoSize
      - name: IIS 진단 회귀(03_web)
        if: always()
        shell: powershell
        run: |
          $bootstrap = '${{ github.event.inputs.bootstrap_windows }}' -eq 'true'
          if ($bootstrap) { .\03_web\tests\run_tests_iis.ps1 -Bootstrap } else { .\03_web\tests\run_tests_iis.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: IIS 조치 안전(03_web)
        if: always()
        shell: powershell
        run: |
          .\03_web\tests\fixtures\apply_iis.ps1 -Mode vuln
          .\lib\tests\fix_safety_windows.ps1 -Category 03_web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: MSSQL 진단 회귀 + 운영 안전(08_dbms, LocalDB)
        if: always()
        shell: powershell
        run: |
          $bootstrap = '${{ github.event.inputs.bootstrap_windows }}' -eq 'true'
          if ($bootstrap) { .\08_dbms\tests\run_tests_mssql.ps1 -Bootstrap } else { .\08_dbms\tests\run_tests_mssql.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows 조치 안전(02_windows)
        if: always()
        shell: powershell
        run: |
          .\lib\tests\fix_safety_windows.ps1 -Category 02_windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PC 조치 안전(07_pc)
        if: always()
        shell: powershell
        run: |
          .\lib\tests\fix_safety_windows.ps1 -Category 07_pc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 방화벽 안전장치(W-64/PC-15/D-10)
        if: always()
        shell: powershell
        run: |
          .\02_windows\tests\firewall_guard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 진단(run.ps1) 운영 안전 실기 검사(lib/tests/run_safety_windows.ps1): 진단 전후 상태 동일(S1)·제한 시간(S2)·
      # 비밀값 미저장/결과 폴더 ACL(S5)·비관리자 실행 거짓 양호(S6). 조치 테스트들 뒤에 둔다(그 상태를 기준으로 비교).
      - name: 진단 운영 안전(02_windows / 07_pc / 03_web IIS / 08_dbms MSSQL)
        if: always()
        shell: powershell
        run: |
          $rc = 0
          foreach ($c in @("02_windows", "07_pc", "03_web", "08_dbms")) {
              .\lib\tests\run_safety_windows.ps1 -Category $c
              if ($LASTEXITCODE -ne 0) { $rc = 1 }
          }
          exit $rc
      - name: bootstrap 산출물 업로드
        if: ${{ always() && github.event.inputs.bootstrap_windows == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-expected-iis-mssql
          path: |
            03_web/tests/fixtures/expected_iis_*.json
            08_dbms/tests/fixtures/expected_mssql_*.json
