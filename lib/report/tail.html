</script>

<script>
(function(){
  "use strict";
  var STATUS_ORDER = {VULN:0, MANUAL:1, ERROR:2, NA:3, GOOD:4};
  var SEV_ORDER = {"상":0, "중":1, "하":2};
  var STATUS_LABEL = {VULN:"취약", MANUAL:"수동점검", ERROR:"오류", NA:"해당없음", GOOD:"양호"};

  function readJson(id){
    var el = document.getElementById(id);
    var txt = el ? el.textContent.trim() : "";
    if (!txt) return null;
    try { return JSON.parse(txt); } catch(e){ console.error("JSON parse 실패:", id, e); return null; }
  }

  var guide = readJson("guide-data");   // { category, prefix, items:[...] }
  var result = readJson("result-data"); // { tool_version, category, host, env, generated_at, items:[{code,status,detail,evidence}] }

  var guideByCode = {};
  (guide && guide.items ? guide.items : []).forEach(function(it){ guideByCode[it.code] = it; });

  var rows = (result && result.items ? result.items : []).map(function(r){
    var g = guideByCode[r.code] || {};
    return {
      code: r.code,
      status: r.status || "MANUAL",
      detail: r.detail || "",
      evidence: r.evidence || "",
      title: g.title || r.code,
      severity: g.severity || "-",
      group_no: g.group_no || 0,
      group_name: g.group_name || "",
      criteria_good: (g.criteria && g.criteria.good) || "",
      criteria_vuln: (g.criteria && g.criteria.vuln) || "",
      remediation: g.remediation || "",
      guide_page: g.guide_page || ""
    };
  });

  rows.sort(function(a,b){
    var sa = STATUS_ORDER[a.status] != null ? STATUS_ORDER[a.status] : 9;
    var sb = STATUS_ORDER[b.status] != null ? STATUS_ORDER[b.status] : 9;
    if (sa !== sb) return sa - sb;
    var va = SEV_ORDER[a.severity] != null ? SEV_ORDER[a.severity] : 9;
    var vb = SEV_ORDER[b.severity] != null ? SEV_ORDER[b.severity] : 9;
    if (va !== vb) return va - vb;
    return a.code.localeCompare(b.code, "ko");
  });

  // ---- 헤더 -------------------------------------------------------------
  document.getElementById("hdr-title").textContent =
    (result && result.category ? result.category : (guide && guide.category) || "") + " 진단 보고서";
  var metaParts = [];
  if (result) {
    metaParts.push("호스트: " + result.host);
    metaParts.push("환경: " + result.env);
    metaParts.push("생성: " + result.generated_at);
    metaParts.push("도구 v" + result.tool_version + " / 가이드 " + result.guide_version + "판");
  }
  document.getElementById("hdr-meta").textContent = metaParts.join("  ·  ");

  // ---- 요약 카드 ----------------------------------------------------------
  var counts = {VULN:0, MANUAL:0, ERROR:0, NA:0, GOOD:0};
  rows.forEach(function(r){ if (counts[r.status] != null) counts[r.status]++; });
  var total = rows.length;
  var judged = total - counts.NA; // N/A 제외 기준 준수율
  var complyBase = counts.VULN + counts.GOOD; // 자동판정된 항목 기준 준수율(단순 참고치)
  // summary.txt·merge.py 와 같은 버림(정수 나눗셈) - 반올림하면 같은 결과가 문서마다 1%p 다르게 보였다(실무 적용 검증 P-22)
  var complyRate = complyBase ? Math.floor((counts.GOOD * 100) / complyBase) : 0;

  var cardsEl = document.getElementById("cards");
  var cardDefs = [
    ["전체", total, ""],
    ["취약", counts.VULN, "vuln"],
    ["수동점검", counts.MANUAL, "manual"],
    ["오류", counts.ERROR, "error"],
    ["해당없음", counts.NA, "na"],
    ["양호", counts.GOOD, "good"]
  ];
  cardsEl.innerHTML = cardDefs.map(function(c){
    return '<div class="card '+c[2]+'"><div class="num">'+c[1]+'</div><div class="lbl">'+c[0]+'</div></div>';
  }).join("") + '<div class="card"><div class="num">'+complyRate+'%</div><div class="lbl">준수율(취약/양호 중)</div></div>';

  var barEl = document.getElementById("dist-bar");
  var colorVar = {VULN:"var(--vuln)", MANUAL:"var(--manual)", ERROR:"var(--error)", NA:"var(--na)", GOOD:"var(--good)"};
  barEl.innerHTML = ["VULN","MANUAL","ERROR","NA","GOOD"].map(function(s){
    var pct = total ? (counts[s] / total * 100) : 0;
    return '<span style="width:'+pct+'%;background:'+colorVar[s]+'"></span>';
  }).join("");

  // ---- 테이블 렌더 --------------------------------------------------------
  var tbody = document.getElementById("tbody");
  var fStatus = document.getElementById("f-status");
  var fSeverity = document.getElementById("f-severity");
  var fText = document.getElementById("f-text");
  var fCount = document.getElementById("f-count");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>]/g, function(c){
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }
  function escAttr(s){ return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

  // ---- 수동점검 사람 판정(1.6.0 G-05) ----------------------------------------------------------------
  // MANUAL 항목에 취약/양호 + 사유를 입력해 manual_verdicts.json 으로 내려받는다(서버 없음). result.json 은
  // 바뀌지 않으며, lib/merge.py --verdicts 가 이 파일을 최종·비교 보고서에 "사람 판정"으로 반영한다.
  // 입력 중인 값은 이 브라우저에만 임시 보관한다(localStorage, 실패해도 동작에는 영향 없음).
  var mv = {};
  var mvKey = "kisa-mv:" + (result ? (result.host + "|" + result.category + "|" + result.generated_at) : "");
  try { mv = JSON.parse(window.localStorage.getItem(mvKey) || "{}") || {}; } catch(e){ mv = {}; }
  function mvSave(){ try { window.localStorage.setItem(mvKey, JSON.stringify(mv)); } catch(e){ /* 저장 불가 무시 */ } }
  function mvGet(code){ if (!mv[code]) mv[code] = {verdict: "", reason: ""}; return mv[code]; }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function isoLocal(d){
    var off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-"; off = Math.abs(off);
    return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds())
      + sign + pad2(Math.floor(off/60)) + ":" + pad2(off%60);
  }
  var mvPanel = document.getElementById("mv-panel");
  var mvBy = document.getElementById("mv-by");
  try { var mvByStored = window.localStorage.getItem("kisa-mv-by"); if (mvByStored) mvBy.value = mvByStored; } catch(e){ /* 무시 */ }
  function mvUpdateStatus(){
    var n = 0;
    rows.forEach(function(r){ if (r.status === "MANUAL" && mv[r.code] && mv[r.code].verdict) n++; });
    document.getElementById("mv-status").textContent = "수동점검 " + counts.MANUAL + "건 중 " + n + "건 사람 판정 입력됨 (항목을 펼쳐 입력)";
  }
  function mvBox(r){
    var v = mvGet(r.code), nm = "mv-" + escAttr(r.code);
    return '<h4>사람 판정 (수동점검)</h4><div class="mv-box">'
      + '<label><input type="radio" class="mv-v" data-code="'+escAttr(r.code)+'" name="'+nm+'" value="VULN"'+(v.verdict === "VULN" ? " checked" : "")+'> 취약</label> '
      + '<label><input type="radio" class="mv-v" data-code="'+escAttr(r.code)+'" name="'+nm+'" value="GOOD"'+(v.verdict === "GOOD" ? " checked" : "")+'> 양호</label> '
      + '<label><input type="radio" class="mv-v" data-code="'+escAttr(r.code)+'" name="'+nm+'" value=""'+(v.verdict ? "" : " checked")+'> 미판정</label>'
      + '<textarea class="mv-r" data-code="'+escAttr(r.code)+'" placeholder="판정 사유(필수)">'+esc(v.reason)+'</textarea>'
      + '</div>';
  }
  function mvDownload(){
    var by = mvBy.value.trim();
    if (!by) { alert("판정자를 입력하세요."); mvBy.focus(); return; }
    var now = isoLocal(new Date()), out = [], bad = [];
    rows.forEach(function(r){
      if (r.status !== "MANUAL" || !mv[r.code]) return;
      var v = mv[r.code], reason = (v.reason || "").trim();
      if (!v.verdict && !reason) return;
      if (!v.verdict || !reason) { bad.push(r.code); return; }
      out.push({code: r.code, verdict: v.verdict, reason: reason, judged_by: by, judged_at: now});
    });
    if (bad.length) { alert("판정(취약/양호)과 사유를 모두 입력하세요: " + bad.join(", ")); return; }
    if (!out.length) { alert("입력한 판정이 없습니다."); return; }
    var obj = {host: result.host, category: result.category, generated_from: result.generated_at, verdicts: out};
    var blob = new Blob([JSON.stringify(obj, null, 2) + "\n"], {type: "application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "manual_verdicts.json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 1000);
  }
  if (result && counts.MANUAL > 0) {
    mvPanel.style.display = "flex";
    document.getElementById("mv-dl").addEventListener("click", mvDownload);
    mvBy.addEventListener("input", function(){ try { window.localStorage.setItem("kisa-mv-by", mvBy.value); } catch(e){ /* 무시 */ } });
    mvUpdateStatus();
  }

  function render(){
    var st = fStatus.value, sv = fSeverity.value, tx = fText.value.trim().toLowerCase();
    var filtered = rows.filter(function(r){
      if (st && r.status !== st) return false;
      if (sv && r.severity !== sv) return false;
      if (tx && (r.code + " " + r.title).toLowerCase().indexOf(tx) === -1) return false;
      return true;
    });
    fCount.textContent = filtered.length + " / " + total + "건 표시";

    var html = "";
    filtered.forEach(function(r, idx){
      var rid = "d" + idx;
      html += '<tr class="item-row" data-target="'+rid+'">'
        + '<td class="code">'+esc(r.code)+'</td>'
        + '<td class="sev">'+esc(r.severity)+'</td>'
        + '<td>'+esc(r.title)+'</td>'
        + '<td class="sev">'+esc(r.group_no)+'. '+esc(r.group_name)+'</td>'
        + '<td><span class="badge '+esc(r.status)+'">'+esc(STATUS_LABEL[r.status] || r.status)+'</span>'
        + (r.status === "MANUAL" && mv[r.code] && mv[r.code].verdict ? '<span class="mv-tag">사람 판정: '+esc(STATUS_LABEL[mv[r.code].verdict])+'</span>' : '')
        + '</td>'
        + '</tr>';
      html += '<tr class="detail-row" id="'+rid+'" style="display:none"><td colspan="5"><div class="detail">'
        + (r.status === "MANUAL" ? mvBox(r) : '')
        + '<h4>판정 근거</h4><div>'+(esc(r.detail) || '-')+'</div>'
        + (r.evidence ? '<h4>증적</h4><pre>'+esc(r.evidence)+'</pre>' : '')
        + '<h4>판단 기준 (가이드 원문)</h4><div>양호: '+esc(r.criteria_good)+'</div><div>취약: '+esc(r.criteria_vuln)+'</div>'
        + '<h4>조치 방법 (가이드 원문)</h4><div>'+esc(r.remediation)+'</div>'
        + (r.guide_page ? '<h4>가이드 페이지</h4><div>p.'+esc(r.guide_page)+'</div>' : '')
        + '</div></td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px;">표시할 항목이 없습니다.</td></tr>';

    Array.prototype.forEach.call(tbody.querySelectorAll(".item-row"), function(tr){
      tr.addEventListener("click", function(){
        var target = document.getElementById(tr.getAttribute("data-target"));
        if (target) target.style.display = (target.style.display === "none") ? "table-row" : "none";
      });
    });
    Array.prototype.forEach.call(tbody.querySelectorAll("input.mv-v"), function(el){
      el.addEventListener("change", function(){
        mvGet(el.getAttribute("data-code")).verdict = el.value; mvSave(); mvUpdateStatus();
        var tag = el.value ? '<span class="mv-tag">사람 판정: '+esc(STATUS_LABEL[el.value])+'</span>' : '';
        var dr = el.closest ? el.closest("tr.detail-row") : null;
        var ir = dr ? dr.previousElementSibling : null;
        if (ir) { var cell = ir.lastElementChild; var old = cell.querySelector(".mv-tag"); if (old) cell.removeChild(old); cell.insertAdjacentHTML("beforeend", tag); }
      });
    });
    Array.prototype.forEach.call(tbody.querySelectorAll("textarea.mv-r"), function(el){
      el.addEventListener("input", function(){ mvGet(el.getAttribute("data-code")).reason = el.value; mvSave(); });
    });
  }

  fStatus.addEventListener("change", render);
  fSeverity.addEventListener("change", render);
  fText.addEventListener("input", render);
  render();

  document.getElementById("footer").textContent =
    "본 보고서는 진단 시점의 스냅샷이며 대상 설정을 변경하지 않습니다. 조치는 별도 fix 스크립트를 통해 수행하세요.";
})();
</script>
</body>
</html>
