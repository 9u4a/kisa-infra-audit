</script>
<script>
(function () {
  "use strict";
  function parse(id) { try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return null; } }
  var guide = parse("guide-data") || { items: [] };
  var data = parse("fix-data") || { meta: {}, items: [] };
  var meta = data.meta || {};
  var byCode = {};
  (guide.items || []).forEach(function (g) { byCode[g.code] = g; });

  // 결과 종류: 표시 이름·색·정렬(위험한 것 먼저)·설명
  var R = {
    FAILED_NOT_ROLLED_BACK: ["실패·원복 못 함", "--bad", 1, "적용이 실패했고 일부를 되돌리지 못함 - 즉시 수동 확인 필요"],
    ABORTED: ["실행 중단", "--bad", 2, "백업 실패 등으로 이 항목에서 실행 전체를 멈춤(이 항목은 원복)"],
    FAILED_ROLLED_BACK: ["실패·원복됨", "--err", 3, "적용 또는 재진단이 실패해 조치 전 상태로 되돌림"],
    PARTIAL_MANUAL: ["일부 적용", "--warn", 4, "일부만 자동 조치됨 - 남은 부분은 수동 조치"],
    MANUAL: ["수동 조치", "--warn", 5, "자동 조치가 없거나 값이 없어 가이드 조치 방법만 안내"],
    DECLINED: ["승인 안 됨", "--skip", 6, "운영자가 확인하지 않았거나 비대화형 실행이라 적용하지 않음"],
    POLICY_SKIPPED: ["정책 제외", "--skip", 7, "정책 파일에서 승인하지 않았거나 이 호스트에서 제외"],
    PREVIEW: ["적용 예정", "--accent", 8, "dry-run 미리보기 - 실제로는 바꾸지 않음"],
    APPLIED: ["적용 완료", "--good", 9, "적용 후 재진단까지 통과"],
    SKIPPED: ["건너뜀", "--skip", 10, "조치 스크립트가 없거나 조치로 해소할 수 없음(변경 없음)"]
  };
  function info(r) { return R[r] || [r || "-", "--skip", 99, ""]; }
  function color(v) { return "var(" + v + ")"; }
  function el(tag, attrs, text) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); });
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function recheck(d) { var m = /recheck=([A-Z]+)/.exec(d || ""); return m ? m[1] : ""; }
  function params(code) {
    var p = (meta.policy || {})["param." + code];
    return p || "";
  }

  // ---- 머리 ----
  var modeText = meta.mode === "apply" ? "실제 적용" : "DRY-RUN(미리보기, 변경 없음)";
  document.getElementById("hdr-title").textContent = "조치 결과 보고서 - " + (meta.category || "");
  var hm = document.getElementById("hdr-meta");
  [["호스트", meta.host], ["모드", modeText], ["생성", meta.generated_at], ["도구", meta.tool_version], ["출력 폴더", meta.out_dir]].forEach(function (kv) {
    if (!kv[1]) return;
    var s = el("span"); s.appendChild(el("b", null, kv[0] + " ")); s.appendChild(document.createTextNode(kv[1] + "   ")); hm.appendChild(s);
  });

  var items = (data.items || []).slice();
  var notices = document.getElementById("notices");
  var pol = meta.policy;
  if (pol) {
    var n = el("div", { "class": "notice" });
    n.appendChild(el("b", null, "정책 모드(무인 조치) - "));
    n.appendChild(document.createTextNode("승인자 " + (pol.approver || "-") + ", 실행자 " + (pol.operator || "-") + " (로그인 " + (pol.login_user || "-") + "), 정책 만료 " + (pol.policy_expires || "-") + ", 호스트 구역 [host:" + (pol.policy_host_section || "-") + "]"));
    n.appendChild(el("br"));
    n.appendChild(document.createTextNode("정책 파일 "));
    n.appendChild(el("code", null, (pol.policy_file || "-") + "  SHA-256 " + (pol.policy_sha256 || "-")));
    notices.appendChild(n);
  }
  var bad = items.filter(function (it) { return it.result === "FAILED_NOT_ROLLED_BACK" || it.result === "ABORTED"; });
  if (bad.length) {
    var w = el("div", { "class": "notice warn" });
    w.appendChild(el("b", null, "즉시 확인 필요: "));
    w.appendChild(document.createTextNode(bad.map(function (it) { return it.code + "(" + info(it.result)[0] + ")"; }).join(", ")));
    notices.appendChild(w);
  }
  if (meta.mode === "apply" && meta.rollback_cmd) {
    var rb = el("div", { "class": "notice" });
    rb.appendChild(el("b", null, "이번 실행 전체 원복: "));
    rb.appendChild(el("code", null, meta.rollback_cmd));
    rb.appendChild(el("br"));
    rb.appendChild(document.createTextNode("원복은 조치 직전 상태로 덮어쓴다. 아래 '원복 제한' 표시가 있는 항목은 완전히 되돌아가지 않는다."));
    notices.appendChild(rb);
  }

  // ---- 요약 카드 ----
  var counts = {};
  items.forEach(function (it) { counts[it.result] = (counts[it.result] || 0) + 1; });
  var cards = document.getElementById("cards");
  Object.keys(counts).sort(function (a, b) { return info(a)[2] - info(b)[2]; }).forEach(function (r) {
    var c = el("div", { "class": "card", title: info(r)[3] });
    var num = el("div", { "class": "num" }, String(counts[r])); num.style.color = color(info(r)[1]);
    c.appendChild(num); c.appendChild(el("div", { "class": "lbl" }, info(r)[0])); cards.appendChild(c);
  });
  var sel = document.getElementById("f-result");
  Object.keys(counts).sort(function (a, b) { return info(a)[2] - info(b)[2]; }).forEach(function (r) { sel.appendChild(el("option", { value: r }, info(r)[0] + " (" + counts[r] + ")")); });

  // ---- 표 ----
  items.sort(function (a, b) { return info(a.result)[2] - info(b.result)[2] || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0); });
  var tbody = document.getElementById("tbody");
  function render() {
    var fr = sel.value, ft = document.getElementById("f-text").value.trim().toLowerCase(), shown = 0;
    tbody.textContent = "";
    items.forEach(function (it) {
      var g = byCode[it.code] || {};
      if (fr && it.result !== fr) return;
      if (ft && (it.code + " " + (g.title || "")).toLowerCase().indexOf(ft) < 0) return;
      shown++;
      var tr = el("tr", { "class": "item-row" });
      tr.appendChild(el("td", { "class": "code" }, it.code));
      tr.appendChild(el("td", { "class": "sev" }, g.severity || ""));
      var tdT = el("td"); tdT.appendChild(document.createTextNode(g.title || ""));
      if (it.rb) { tdT.appendChild(document.createTextNode(" ")); tdT.appendChild(el("span", { "class": "tag risk", title: it.rb }, "원복 제한")); }
      if (it.im) { tdT.appendChild(document.createTextNode(" ")); tdT.appendChild(el("span", { "class": "tag risk", title: it.im }, "업무 영향")); }
      if (params(it.code)) { tdT.appendChild(document.createTextNode(" ")); tdT.appendChild(el("span", { "class": "tag" }, "정책 값")); }
      tr.appendChild(tdT);
      tr.appendChild(el("td", { "class": "sev" }, it.grade || ""));
      var tdR = el("td"); var b = el("span", { "class": "badge" }, info(it.result)[0]); b.style.background = color(info(it.result)[1]); tdR.appendChild(b); tr.appendChild(tdR);
      tr.appendChild(el("td", { "class": "sev" }, recheck(it.detail)));
      var dr = el("tr", { "class": "detail-row" }); dr.style.display = "none";
      var td = el("td", { colspan: "6" }); var d = el("div", { "class": "detail" });
      function sec(h, body) { if (!body) return; d.appendChild(el("h4", null, h)); d.appendChild(el("pre", null, body)); }
      sec("결과", info(it.result)[0] + " - " + info(it.result)[3] + (it.time ? "\n기록 시각 " + it.time : ""));
      sec("상세(조치 기록)", it.detail);
      sec("정책 값(운영자 판단)", params(it.code));
      sec("변경 내용", it.chg);
      sec("원복 제한", it.rb);
      sec("업무 영향", it.im);
      sec("가이드 조치 방법", g.remediation);
      td.appendChild(d); dr.appendChild(td);
      tr.addEventListener("click", function () { dr.style.display = dr.style.display === "none" ? "" : "none"; });
      tbody.appendChild(tr); tbody.appendChild(dr);
    });
    document.getElementById("f-count").textContent = shown + " / " + items.length + "건";
  }
  sel.addEventListener("change", render);
  document.getElementById("f-text").addEventListener("input", render);
  render();
  document.getElementById("footer").textContent = "주요정보통신기반시설 자동 진단 도구 " + (meta.tool_version || "") + " · 가이드 " + (guide.guide_version || "") + " · changes.log 기준 생성";
})();
</script>
</body>
</html>
